name: Verificar regras pedagógicas
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pedagogia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verificar sintaxe
        run: |
          node --check engine.js
          node --check assessment.js
          node --check nilo.js
          node --check app.js
          node --check data/catalog.js
      - name: Testar regras de aprendizagem
        run: npm test
