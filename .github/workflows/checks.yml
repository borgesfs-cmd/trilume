name: Verificar regras pedagógicas
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pedagogia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verificar sintaxe
        run: |
          node --check insights.js
          node --check areas.js
          node --check support.js
          node --check quick-forms.js
          node --check repertoire.js
          node --check data/repertoire.js
          node --check storage.js
          node --check library-tools.js
          node --check word-lab.js
          node --check gamification.js
          node --check data/early-childhood.js
          node --check engine.js
          node --check assessment.js
          node --check nilo.js
          node --check app.js
          node --check data/catalog.js
      - name: Testar regras de aprendizagem
        run: npm test
